[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
camera = "1.6.2"
coroutines = "1.11.0"
serializationJson = "1.13.0"
okhttp = "5.5.1"
bouncycastle = "1.87"
zxing = "3.5.4"
junit = "4.13.2"
guava = "33.8.0-android"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
# The WebSocket to the relay.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# X25519 and ChaCha20-Poly1305: Android has them only from API 31 and 28; the app starts at 26.
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
# Reads the pairing QR code from camera frames.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# Not used by Jig's own code: CameraX brings it in (through androidx.media3). Held at a version with
# the fix for GHSA-xxph-c9ww-hj94 (memory exhaustion when deserializing; fixed in 33.7.2).
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
