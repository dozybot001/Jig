name: 缺陷 / Bug report
description: 有什么地方不对 / Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        安全问题请不要在这里报，见 [SECURITY.md](https://github.com/dozybot001/Yew/blob/main/SECURITY.md)。请不要贴 API Key、登录链接或会话里的私人内容。
        Please report security problems privately, as [SECURITY.md](https://github.com/dozybot001/Yew/blob/main/SECURITY.md) says. Do not paste API keys, sign-in links or private session content.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 你看到了什么，原本应该怎样 / What you saw, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: "`yew --version` 的输出，或手机应用关于页里的版本 / Output of `yew --version`, or the version on the phone app's About page"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统 / System
      placeholder: macOS 26 · Node.js 24 / Ubuntu 24.04 / iOS 26 / Android 15
  - type: textarea
    id: more
    attributes:
      label: 其他 / Anything else
      description: 截图、`yew serve` 的输出（去掉登录链接）等 / Screenshots, output of `yew serve` with the sign-in link removed, and so on
