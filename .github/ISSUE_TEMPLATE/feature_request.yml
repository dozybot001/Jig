name: 建议 / Suggestion
description: 想要的功能或改进 / A feature or an improvement you would like
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么 / What problem it solves
      description: 你在做什么时遇到了什么不便 / What you were doing, and what got in the way
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的想法 / Your idea
      description: 希望 Yew Harness 怎样做 / How you would like Yew Harness to handle it
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: 其他 / Anything else
      description: 别的做法、参考的产品或截图 / Alternatives, products to compare with, or screenshots
